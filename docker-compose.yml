services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spandan_clinic
      POSTGRES_USER: spandan
      POSTGRES_PASSWORD: spandan_secret_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spandan -d spandan_clinic']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://spandan:spandan_secret_dev@db:5432/spandan_clinic
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-replace-before-production-12345}
      CORS_ORIGIN: http://localhost:3000,http://localhost
      FRONTEND_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      INTERNAL_API_URL: http://backend:4000/api
    depends_on:
      - backend

volumes:
  pgdata:
